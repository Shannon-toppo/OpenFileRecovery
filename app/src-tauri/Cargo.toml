[package]
name = "ofr-gui"
description = "Open File Recovery: Tauri GUI"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

# コアのワークスペースには入れない。GUI のビルドには Node と Tauri の
# ツールチェインが要るので、CLI とコアの CI を軽く保つため分けてある。
[workspace]

[lib]
name = "ofr_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ofr-core = { path = "../../crates/ofr-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
