[workspace]
resolver = "3"
members = [
    "crates/ofr-device",
    "crates/ofr-image",
    "crates/ofr-fs",
    "crates/ofr-fat",
    "crates/ofr-exfat",
    "crates/ofr-carve",
    "crates/ofr-copy",
    "crates/ofr-testfs",
    "crates/ofr-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
ofr-device = { path = "crates/ofr-device" }
ofr-image = { path = "crates/ofr-image" }
ofr-fs = { path = "crates/ofr-fs" }
ofr-fat = { path = "crates/ofr-fat" }
ofr-exfat = { path = "crates/ofr-exfat" }
ofr-carve = { path = "crates/ofr-carve" }
ofr-copy = { path = "crates/ofr-copy" }
ofr-testfs = { path = "crates/ofr-testfs" }

thiserror = "2"
tracing = "0.1"
memchr = "2"
crc32fast = "1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# 復旧対象デバイスを何度も読むので、開発ビルドでも最適化を効かせておく。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
