[workspace]
resolver = "3"
members = ["crates/ofr-device", "crates/ofr-image", "crates/ofr-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
ofr-device = { path = "crates/ofr-device" }
ofr-image = { path = "crates/ofr-image" }

thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# 復旧対象デバイスを何度も読むので、開発ビルドでも最適化を効かせておく。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
