[package]
name = "ofr-core"
description = "Open File Recovery: 解析・復元機能を束ねる公開 API (ジョブ管理と進捗イベント)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ofr-device.workspace = true
ofr-image.workspace = true
ofr-fs.workspace = true
ofr-fat.workspace = true
ofr-exfat.workspace = true
ofr-carve.workspace = true
ofr-copy.workspace = true
ofr-repair.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
ofr-device = { workspace = true, features = ["mock"] }
ofr-testfs.workspace = true
tempfile = "3"
# 復元結果とカービングのテストに本物の画像が要る。
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
