name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Phase 0/1 の完了条件: モックに対するユニットテストが両OSで通ること。
  # 実デバイスを使うテストは CI に置けないので、手動チェックリスト (README) で確認する。
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --all-features
      - name: test
        run: cargo test --workspace --all-features
      - name: build without optional features
        run: cargo build --workspace --no-default-features

  lint:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # OS 別のデバイス実装があるので、clippy も両方で回す。
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # GUI (Phase 6)。コアのワークスペースとは別クレートなので、ここで別に回す。
  # 実際のインストーラ作成は release ワークフローの仕事で、ここは
  # 「両 OS でビルドが通り、型が合っているか」までを見る。
  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: npm ci
        run: npm ci
      - name: フロントの型チェックとビルド
        run: npm run build
      - name: rustfmt
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
